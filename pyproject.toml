[project]
name = "rft-llm"
version = "0.1.0"
description = "RL Fine-tuning of LLMs using SkyRL, Tinker, and OpenAI RFT API"
requires-python = ">=3.11"
dependencies = [
    # LLM Training Stack
    "transformers>=4.40.0",
    "datasets>=2.16.0",
    "accelerate>=0.33.0",
    "peft>=0.8.0",  # For LoRA fine-tuning - required to avoid full model weight updates
    
    # DeepSpeed for distributed training optimization
    "deepspeed>=0.13.0",
    
    # SkyRL Stack
    "skyrl",
    
    # GPU Support
    "torch==2.4.0",
    "torchvision==0.20.0",
    
    # Monitoring
    "wandb>=0.16.0",
    "tensorboard==2.18.0",
    
    # Utilities
    "sentencepiece>=0.1.99",
    "protobuf>=4.25.0",
    "numpy<2",
    "scipy>=1.10",
    "lz4>=4.3",
    
    # Development & Testing
    "pytest",
    "mypy==1.8.0",
    "typer>=0.9",
    
    # Legacy RL packages (kept for compatibility)
    "gymnasium[atari]==0.29.1",
    "gymnasium[classic-control]==0.29.1",
    "gymnasium[accept-rom-license]==0.29.1",
    "moviepy==1.0.3",
    "opencv-python==4.10.0.84",
    "pytorch-ignite==0.5.1",
    "ptan==0.8.1",
    "stable-baselines3==2.3.2",
    "torchrl==0.6.0",
    "ray==2.37.0",
    "dm-tree==0.1.9",
    "GPUtil>=1.4",
]

[tool.setuptools]
packages = []  # Don't install any packages, just dependencies

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

