# Base training configuration for SkyRL with PPO agent and LoRA fine-tuning

# Training hyperparameters
training:
  num_epochs: 3
  batch_size: 4
  gradient_accumulation_steps: 8
  learning_rate: 1.0e-5
  warmup_steps: 100
  max_grad_norm: 1.0
  save_steps: 500
  eval_steps: 500
  logging_steps: 10

# PPO hyperparameters
ppo:
  clip_epsilon: 0.2
  value_loss_coef: 0.5
  entropy_coef: 0.01
  gamma: 0.99
  lam: 0.95
  kl_penalty: "kl"
  kl_target: 0.1
  kl_horizon: 10000

# LoRA configuration - avoids modifying base model weights
lora:
  enabled: true
  r: 16  # LoRA rank
  lora_alpha: 32  # LoRA alpha scaling parameter
  target_modules:  # Modules to apply LoRA to (Qwen-specific)
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"
  lora_dropout: 0.1
  bias: "none"
  task_type: "CAUSAL_LM"

# DeepSpeed ZeRO configuration for memory efficiency
deepspeed:
  enabled: true
  zero_stage: 2  # ZeRO-2 for single node multi-GPU
  offload_optimizer: false
  offload_param: false

# WandB logging
wandb:
  enabled: true
  project: "rft-llm-skyrl"
  entity: null  # Set your WandB entity/username here
  tags:
    - "skyrl"
    - "ppo"
    - "lora"
    - "qwen"

# Output directories
output:
  checkpoint_dir: "../checkpoints"
  log_dir: "../logs"
  data_dir: "../data"

