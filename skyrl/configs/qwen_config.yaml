# Qwen model configurations - supports multiple model sizes

# Model variants
models:
  qwen2_0_5b:
    model_name: "Qwen/Qwen2-0.5B-Instruct"
    max_length: 2048
    description: "Smallest Qwen2 model - fastest training"
    
  qwen2_1_5b:
    model_name: "Qwen/Qwen2-1.5B-Instruct"
    max_length: 2048
    description: "Small Qwen2 model - good balance"
    
  qwen2_7b:
    model_name: "Qwen/Qwen2-7B-Instruct"
    max_length: 2048
    description: "Medium Qwen2 model - requires more memory"
    
  qwen2_72b:
    model_name: "Qwen/Qwen2-72B-Instruct"
    max_length: 2048
    description: "Large Qwen2 model - requires significant resources"

# Default model to use
default_model: "qwen2_1_5b"

# Tokenizer settings
tokenizer:
  padding_side: "right"
  truncation: true
  return_tensors: "pt"

# Generation settings for inference/evaluation
generation:
  max_new_tokens: 512
  temperature: 0.7
  top_p: 0.9
  do_sample: true
  pad_token_id: null  # Will use tokenizer.eos_token_id

