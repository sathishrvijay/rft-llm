[project]
name = "rft-llm"
version = "0.1.0"
description = "RL Fine-tuning of LLMs using SkyRL, Tinker, and OpenAI RFT API"
requires-python = ">=3.11"
dependencies = [
    # LLM Training Stack
    "transformers>=4.40.0",
    "datasets>=2.16.0",
    "accelerate>=0.33.0",
    "peft>=0.8.0",  # For LoRA fine-tuning - required to avoid full model weight updates
    
    # DeepSpeed for distributed training optimization
    "deepspeed>=0.13.0",
    
    # SkyRL Stack
    "skyrl",
    "ray>= 2.44.0",
    
    # GPU Support
    "torch==2.5.0",
    "torchvision==0.20.0",
    
    # Monitoring
    "wandb>=0.16.0",
    "tensorboard==2.18.0",
    
    # Utilities
    "sentencepiece>=0.1.99",
    "protobuf>=4.25.0",
    "numpy<2",
    "scipy>=1.10",
    "lz4>=4.3",
    
    # Development & Testing
    "pytest",
    "mypy==1.8.0",
    "typer>=0.9",
    
]

[tool.setuptools]
packages = []  # Don't install any packages, just dependencies

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

